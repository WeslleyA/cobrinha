<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha</title>
    <style>
        body{
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
            font-family: sans-serif;
        }
        #scoreBoard{
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        canvas{
            border: 2px solid #fff;
            background-color: #000;

        }
    </style>
</head>
<body>
    <div id="scoreBoard">
        Pontos: <span id="score">0</span> | Recorde: <span id="highScore">0</span>
    </div>
    <canvas id="gamecanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gamecanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("highScore");

        //-- CONFIGURAÇÃO DE GRADE --
        const gridSize = 20; // Cada quadrado tem 20x20 pixels
        const tileCount = canvas.width / gridSize; //400 / 20 = 20 blocos na horizontal/vertical

        //-- ESTADO DO JOGO --
            let snake = [];
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") ? parseInt(localStorage.getItem("snakeHighScore")) : 0;
        highScoreEl.textContent = highScore;

        let dx = 1;
        let dy = 0;
        let food = { x: 5, y: 5 };
        let isGameOver = false;
        
        // --- INICIALIZAR / REINICIAR O JOGO ---
        function resetGame(){
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];
            score = 0;
            scoreEl.textContent = score;
            dx = 1;
            dy = 0;
            isGameOver = false;
            generateFood();
        }


        // --- FUNÇÃO PARA GERAR UMA NOVA MAÇÃ ---
        function generateFood(){
            // Gera coordenadas aleatórias dentro do limite do grid (0 a 19)
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };

            //Evita que a maçã nasça em cima do corpo da cobra
            const isOnSnake = snake.some(segment => segment.x === food.x && segment.y === food.y);
            if (isOnSnake){
                generateFood(); // tenta gerar em outro local se caiu em cima da cobra
            }
        }

        function drawGrid() {
            // Desenha o fundo da grade (opcional, para visualização)
            ctx.fillStyle = "#181818";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((segment, index)=>{
                //A cabeça fica amarela, o corpo fica verde
                ctx.fillStyle = index === 0 ? "#ffd700" : "#4caf50";
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize - 2, // -2 para deixar um pequeno espaço entre os blocos
                    gridSize -2 

                );
            });

        }

        // --- DESENHAR A MAÇÃ---
        function drawFood(){
            ctx.fillStyle = "#ff4d4d";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,

                gridSize -2,
                gridSize - 2
            );
        }
        // --- CHECAGEM DE COLISÃO ---
        function checkCollision(head){
            // 1. Colisão com as Paredes
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= tileCount;
            const hitTopWall = head.y < 0;
            const hitBottomWall = head.y >= tileCount;

            if (hitLeftWall || hitRightWall || hitTopWall || hitBottomWall){
                return true;
            }
            // 2. Colisão com o Próprio Corpo
            const hitSelf = snake.some(segment => segment.x === head.x && segment.y ===  head.y);
            if (hitSelf){
                return true;
            }
            return false;
        }

        function moveSnake(){
            if (isGameOver) return;
            // 1. Cria a nova cabeça
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            // 2. Verifica se a nova posição causa colisão
            if (checkCollision(head)){
                isGameOver = true;
                return;
            }

            // 3. Insere no começo do array
            snake.unshift(head);

            // 4. Verifica se a cabeça alcançou a maçã
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                // Atualiza e salva o recorde se superar a pontuação anterior
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem("snakeHighScore", highScore);
                }
                generateFood(); //Gera um nova maçã em outro lugar
                //Não chamamos snake.pop(), permitiindo que a cobra cresça( La ele !)
            }else {
                // Se não comeu, remove a cauda Normalmente
                snake.pop();

            }
        }

        // --- TELA DE GAME OVER ---
        function drawGamerOver(){
            if(!isGameOver) return;

            //Fundo escuro semi-transparente
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Texto de Game Over
            ctx.fillStyle = "#ff4d4d";
            ctx.font = "bold 32px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

            ctx.fillStyle = "#ffffff";
            ctx.font = "16px sans-serif";
            ctx.fillText(`Pontuação: ${score}`, canvas.width / 2, canvas.height / 2 + 5);
            ctx.fillText(`Recorde Histórico: ${highScore}`, canvas.width / 2, canvas.height / 2 + 30);

            ctx.fillStyle = "#aaa";
            ctx.font = "14px sans-serif";
            ctx.fillText("Pressione [ESPAÇO] ou [R] para reiniciar", canvas.width / 2, canvas.height / 2 + 70);
        }


        function update(){
            moveSnake();

            // Limpa e redesenha
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawFood();
            drawSnake();
            drawGamerOver();
        }

        // --- CONTROLES DE TECLADO ---
        window.addEventListener("keydown", (e) => {

            // Reiniciar o jogo se estiver em Game Over
            if (isGameOver && (e.code === "Space" || e.key === "r" || e.key === "R")) {
                resetGame();
                return;
            }
            // Movimentação
            // Evita que a cobra dê "meia volta" nela mesma
            if ((e.key === "ArrowUp" || e.key === "w") && dy === 0) {
                dx = 0; dy = -1;
            } else if ((e.key === "ArrowDown" || e.key === "s") && dy === 0) {
                dx = 0; dy = 1;
            } else if ((e.key === "ArrowLeft" || e.key === "a") && dx === 0) {
                dx = -1; dy = 0;
            } else if ((e.key === "ArrowRight" || e.key === "d") && dx === 0) {
                dx = 1; dy = 0;
            }
        });

        // Inicia a partida
        resetGame();
        setInterval(update, 100);

    </script>
    
</body>
</html>
